      },
      clube:{
        title:"Clube do Tricorumi",price:"R$ 19,90",suffix:"no primeiro mês",shortPay:"no 1º mês",
        intro:"Você é movida por novidade, inspiração e pela vontade de criar sempre mais. Imagine abrir uma biblioteca de Tricorumi e escolher, a cada novo projeto, qual personagem vai nascer das suas agulhas.",
        items:["Depois, R$ 47,90 por mês","Biblioteca completa enquanto assina","Novas receitas adicionadas","Cancele quando quiser"],
        cta:"Quero entrar no clube",url:links.clube
      },
      pdf:{
        title:"PDF Avulso",price:"R$ 47,90",suffix:"cada receita",shortPay:"cada receita",
        intro:"Você gosta de liberdade e já sabe o que faz seus olhos brilharem: encontrar um bichinho encantador, escolher a receita e começar. Um único personagem pode ser o início de uma paixão — o perigo é querer fazer a família inteira depois 😂.",
        items:["Escolha somente seu favorito","Receita digital passo a passo","Compre quando quiser","Ideal para testar a técnica"],
        cta:"Quero escolher um PDF",url:links.pdf
      }
    };

    const characterImages=[
      {src:"Coelha Alice.png",alt:"Coelha Alice em Tricorumi"},
      {src:"Elefante Tito.png",alt:"Elefante Tito em Tricorumi"},
      {src:"Ovelha Nina.png",alt:"Ovelha Nina em Tricorumi"},
      {src:"Trio de Naninhas.png",alt:"Trio de naninhas em Tricorumi"},
      {src:"capivara-amora.png",alt:"Capivara Amora em Tricorumi"},
      {src:"coelha-aurora.png",alt:"Coelha Aurora em Tricorumi"},
      {src:"coelho-bento.png",alt:"Coelho Bento em Tricorumi"},
      {src:"patinha.png",alt:"Patinha Penélope em Tricorumi"},
      {src:"ratinha.png",alt:"Ratinha Bella em Tricorumi"},
      {src:"urso Nico.png",alt:"Urso Nico em Tricorumi"},
      {src:"urso-ludovico.png",alt:"Urso Ludovico em Tricorumi"},
      {src:"urso_oliver.png",alt:"Urso Oliver em Tricorumi"}
    ];

    const productImages={
      completo:{src:"urso-ludovico.png",alt:"Urso Ludovico em Tricorumi"},
      mini:{src:"Coelha Alice.png",alt:"Coelha Alice em Tricorumi"},
      clube:{src:"capivara-amora.png",alt:"Capivara Amora em Tricorumi"},
      pdf:{src:"ratinha.png",alt:"Ratinha Bella em Tricorumi"}
    };

    function characterMarkup(image){
      return `<figure class="character-wrap"><img class="character-img" src="${encodeURI(image.src)}" alt="${image.alt}" loading="eager" onerror="this.closest('.character-wrap').hidden=true"></figure>`;
    }

    const app=document.getElementById("app");
    const progress=document.getElementById("progress");
    const fill=document.getElementById("fill");
    const progressText=document.getElementById("progressText");
    let index=-1;
    let scores={completo:0,mini:0,clube:0,pdf:0};
    let answers=[];
    let techniqueAnswer="no";

    function questionPosition(){
      return screens.slice(0,index+1).filter(s=>s.type==="question").length;
    }
    function updateProgress(){
      const current=questionPosition();
      const total=screens.filter(s=>s.type==="question").length;
      progress.style.display=index>=0?"block":"none";
      fill.style.width=`${Math.max(0,answers.length/total*100)}%`;
      progressText.textContent=current?`Pergunta ${current} de ${total}`:"";
    }
    function start(){
      startBackgroundMusic();
      index=0;
      gtag('event','quiz_start',{quiz_name:'tricorumi'});
      render();
    }
    function render(){
      updateProgress();
      const s=screens[index];
      if(s.type==='emotion') return renderEmotion(s);
      if(s.type==='question') gtag('event','quiz_question_view',{question_number:questionPosition()});
      if(s.type==="message") return renderMessage(s);
      if(s.type==="techniqueMessage") return renderMessage(techniqueMessages[techniqueAnswer]);
      const answersHtml=s.answers.map((a,i)=>{
        const label=s.price?`<b>${a[0]}</b>${a[1]}`:a[0];
        return `<button class="answer" type="button" data-i="${i}">${label}</button>`;
      }).join("");
      app.innerHTML=`<section class="card">
        ${characterMarkup(characterImages[index%characterImages.length])}
        <span class="eyebrow">${s.price?"Última pergunta • seu investimento":"Descubra sua fase atual no tricô"}</span>
        <h3>${s.title}</h3>
        <div class="answers">${answersHtml}</div>
      </section>`;
      app.querySelectorAll(".answer").forEach(btn=>btn.onclick=()=>choose(+btn.dataset.i));
    }
    function renderMessage(s){
      app.innerHTML=`<section class="card message-card">
        ${characterMarkup(characterImages[index%characterImages.length])}
        <h2>${s.title}</h2>
        <p>${s.text}</p>
        <button class="btn primary" type="button" id="continue">Continuar</button>
      </section>`;
      document.getElementById("continue").onclick=next;
    }
    function renderEmotion(s){
      const scene=index===2?1:2;
      gtag('event','quiz_emotion_view',{scene_number:scene});
      app.innerHTML=`<section class="card emotion-card">
        <span class="eyebrow">O carinho mora nos detalhes</span>
        <div class="emotion-media">
          
          <video class="scene-video" autoplay playsinline muted loop preload="auto" poster="${s.poster}" aria-label="Vídeo com bichinho feito à mão"><source src="${s.video}" type="video/mp4"></video>
          <button class="watch-video" type="button" hidden>▶ Ver o vídeo</button>
        </div>
        <h2>${s.title}</h2><p>${s.text}</p>
        <p class="scene-note">Cena ilustrativa • cada criação é única</p>
        <button class="btn primary" id="continue" type="button">Próxima pergunta</button>
        <button class="skip-link" id="skip" type="button">Pular esta pausa</button>
        <a class="direct-buy" href="${links.completo}" target="_blank" rel="noopener">Quero ir direto para o curso completo • 12x de R$ 20,46 →</a>
      </section>`;
      const video=app.querySelector('video'),play=app.querySelector('.watch-video');
      function fallback(){video.controls=true;play.hidden=false;play.textContent='▶ Reproduzir vídeo';}
      video.addEventListener('error',fallback,{once:true});
      video.querySelector('source').addEventListener('error',fallback,{once:true});
      let trackedPlay=false;
      video.addEventListener('playing',()=>{
        play.hidden=true;
        if(!trackedPlay){trackedPlay=true;gtag('event','quiz_video_play',{scene_number:scene});}
      });
      video.muted=true;
      play.onclick=()=>video.play().catch(()=>{play.textContent='▶ Tentar reproduzir';});
      video.play().catch(()=>{play.hidden=false;});
      document.getElementById('continue').onclick=()=>{video.pause();next()};
      document.getElementById('skip').onclick=()=>{video.pause();next()};
    }
    function choose(i){
      const choice=screens[index].answers[i];
      if(screens[index].technique) techniqueAnswer=i===0?"yes":"no";
      const score=choice[choice.length-1];
      Object.entries(score).forEach(([k,v])=>scores[k]+=v);
      answers.push({screen:index,choice:i,score});
      gtag('event','quiz_answer',{question_number:questionPosition(),answer_number:i+1});
      next();
    }
    function next(){
      index++;
      if(index<screens.length) render(); else showResult();
    }
    function winner(){
      const priority=["completo","mini","clube","pdf"];
      return priority.sort((a,b)=>scores[b]-scores[a])[0];
    }
    function showResult(){
      const key=winner();
      gtag('event','quiz_complete',{recommended_product:key,question_count:answers.length});
      progress.style.display="block";fill.style.width="100%";progressText.textContent="Resultado pronto ✨";
      const p=products[key];
      const alternatives=Object.entries(products).filter(([k])=>k!==key)
        .map(([k,v])=>`<a class="other-option" href="${v.url}" target="_blank" rel="noopener">${v.title}<span>${v.price} ${v.shortPay}</span></a>`).join("");
      app.innerHTML=`<section class="card result-card">
        <div class="result-layout">
          <div>
            <span class="eyebrow">Seu próximo bichinho começa aqui</span>
            <h2>${p.title}</h2>
            <p>${p.intro}</p>
            <div class="price"><strong>${p.price}</strong><span>${p.suffix}</span></div>
            <ul class="included">${p.items.map(x=>`<li>${x}</li>`).join("")}</ul>
            <div class="result-actions">
              <a class="btn primary" href="${p.url}" target="_blank" rel="noopener">${p.cta}</a>
              <button class="btn ghost" type="button" id="restart">Refazer quiz</button>
            </div>
            <p class="other-title">Mudou de ideia? Você também pode escolher:</p>
            <div class="other-options">${alternatives}</div>
          </div>
          <aside class="recommend">
            <span class="stamp">💛</span>
            <strong>Por que combina com você?</strong>
            <p>Esta indicação considera suas respostas sobre habilidade, objetivo e forma de aprender. Você escolhe se faz sentido neste momento.</p>
            <p><strong>Garantia de 7 dias.</strong> Você pode conhecer o conteúdo e decidir com tranquilidade.</p>
            <p class="guarantee">A técnica ainda é pouco conhecida por muitas artesãs e está ganhando mercado pelo apelo afetivo e visual.</p>
          </aside>
        </div>
        <div class="result-videos">
          <h3>O carinho que inspira cada ponto</h3>
          <p>Imagine entregar um bichinho feito pelas suas mãos.</p>
          <div class="result-videos-grid">
            <video autoplay muted loop playsinline preload="metadata" poster="ratinha.png" aria-label="Vídeo de criança abraçando bichinho de tricô">
              <source src="midia/resultado.mp4" type="video/mp4">
            </video>
            <video autoplay muted loop playsinline preload="metadata" poster="patinha.png" aria-label="Outro vídeo de criança com bichinho de tricô">
              <source src="animate%20(1).mp4" type="video/mp4">
            </video>
          </div>
        </div>
      </section>`;
      app.querySelectorAll('.result-videos video').forEach(clip=>{
        clip.muted=true;
        clip.play().catch(()=>{clip.controls=true;});
      });
      document.getElementById("restart").onclick=restart;
    }
    function restart(){
      gtag('event','quiz_restart');
      index=-1;scores={completo:0,mini:0,clube:0,pdf:0};answers=[];techniqueAnswer="no";
      renderIntro();
    }
    function renderIntro(){
      progress.style.display="none";
      app.innerHTML=`<section class="card">
        <span class="eyebrow">Quiz rápido • resultado personalizado</span>
        <h1>Sabe aquele quentinho no coração?</h1>
        <p class="lead">É essa alegria que você pode sentir ao terminar seu primeiro bichinho em tricô. Não tem nada mais gostoso do que olhar para uma criação e dizer: <strong>“Uau! Fui eu que fiz!”</strong></p>
        <button class="btn primary" type="button" id="start">Quero descobrir meu próximo passo</button>
        <p class="micro">6 perguntas • sem cadastro • resultado na hora</p>
        <a class="direct-buy" href="${links.completo}" target="_blank" rel="noopener">Já sei que quero aprender! Ir direto para o curso completo • 12x de R$ 20,46 →</a>
      </section>`;
      document.getElementById("start").onclick=start;
    }
    index=-1;
    renderIntro();

    // Trilha ambiente original Peaceful Land, de Sonican, hospedada no repositório.
    // Autoplay audível pode ser bloqueado pelo navegador até o primeiro clique.
    const soundtrack=document.createElement('audio');
    soundtrack.id='tricorumi-soundtrack';
    soundtrack.src='sonican-acoustic-guitar-amp-piano-peaceful-land-321481.mp3';
    soundtrack.preload='auto';
    soundtrack.autoplay=true;
    soundtrack.loop=true;
    soundtrack.muted=false;
    soundtrack.volume=0.4;
    document.body.appendChild(soundtrack);

    const musicBox=document.createElement('div');
    musicBox.className='music-box';
    musicBox.innerHTML=`<button type="button" class="music-toggle" aria-pressed="false">♫ Ativar música</button>
      <label class="music-volume"><span>Volume</span><input type="range" min="0" max="100" value="40" step="5" aria-label="Volume da trilha em porcentagem"></label>`;
    document.body.appendChild(musicBox);
    const musicButton=musicBox.querySelector('.music-toggle');
    const musicVolume=musicBox.querySelector('input');
    let musicOptedOut=false;
    let musicUnavailable=false;

    function syncMusicButton(){
      const playing=!soundtrack.paused && !soundtrack.ended;
      musicButton.textContent=musicUnavailable?'♫ Áudio indisponível':playing?'♫ Pausar música':'♫ Ativar música';
      musicButton.setAttribute('aria-pressed',String(playing));
      musicButton.setAttribute('aria-label',playing?'Pausar música ambiente':'Ativar música ambiente');
    }
    function startBackgroundMusic(){
      if(musicOptedOut||musicUnavailable||!soundtrack.paused)return;
      soundtrack.muted=false;
      soundtrack.volume=Number(musicVolume.value)/100;
      const playback=soundtrack.play();
      if(playback && typeof playback.catch==='function'){
        playback.then(syncMusicButton).catch(()=>{syncMusicButton();});
      }
    }
    musicButton.onclick=()=>{
      if(!soundtrack.paused){
        musicOptedOut=true;
        soundtrack.pause();
      }else{
        musicOptedOut=false;
        startBackgroundMusic();
      }
      syncMusicButton();
    };
    musicVolume.oninput=()=>{
      soundtrack.volume=Number(musicVolume.value)/100;
      if(soundtrack.volume===0){soundtrack.muted=true;}else{soundtrack.muted=false;}
    };
    soundtrack.addEventListener('play',syncMusicButton);
    soundtrack.addEventListener('pause',syncMusicButton);
    soundtrack.addEventListener('ended',syncMusicButton);
    soundtrack.addEventListener('error',()=>{
      musicUnavailable=true;
      syncMusicButton();
      musicButton.title='Não foi possível carregar o arquivo de áudio. Confira a trilha no repositório.';
    });
    document.addEventListener('pointerdown',event=>{
      if(!event.target.closest('.music-box'))startBackgroundMusic();
    },{capture:true});
    document.addEventListener('keydown',event=>{
      if((event.key==='Enter'||event.key===' ')&&!event.target.closest('.music-box'))startBackgroundMusic();
    },{capture:true});
    // Tenta reproduzir no carregamento e ao concluir o carregamento da mídia.
    // Se a política do navegador bloquear áudio com som, o primeiro clique libera o play.
    soundtrack.addEventListener('canplay',startBackgroundMusic,{once:true});
    startBackgroundMusic();

    app.addEventListener('click', function(event){
      const direct=event.target.closest('a.direct-buy');
      if(direct) gtag('event','checkout_click',{transport_type:'beacon',recommended_product:'completo',source:'direct_buy'});
      const link=event.target.closest('.result-card a[href]');
      if(link) gtag('event','checkout_click',{transport_type:'beacon',recommended_product:winner(),destination:link.href});
    });
  </script>
</body>
</html>
